# golangci-lint configuration for toyraft.
#
# Schema: v2 (version: "2"). Migrated from the v1 schema on 2026-07-04
# (Phase 14 / QUAL-01) via `golangci-lint migrate` — see
# docs/adr/0003-golangci-lint-config.md. The v2 binary cannot parse a v1
# config, so this config is bumped in lockstep with the CI action pin.
#
# Policy:
#   - Correctness findings (govet, errcheck, staticcheck, ineffassign, unused)
#     are BLOCKING. In v2, staticcheck subsumes the old gosimple + stylecheck
#     families (S/QF/ST checks).
#   - Style findings (revive, misspell) are advisory but enforced in CI to
#     keep diffs clean.
#   - gosec deliberately excluded — see docs/adr/0003-golangci-lint-config.md
#     (false-positive rate too high for math/rand-with-seeds patterns).
version: "2"
run:
  go: "1.26"
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: var-naming
        - name: error-return
        - name: unexported-return
        - name: blank-imports
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
