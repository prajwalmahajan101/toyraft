# ToyRaft CI — see docs/adr/0002-bring-ci-forward.md
#
# Four jobs: lint, test (matrix), commitlint, build (cross-compile).
# Required-check names are enumerated verbatim in ADR-0002; branch protection
# in plan 04 references those names. If you rename a job's `name:` field
# below, update ADR-0002 in the same commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # golangci-lint-action MUST be v7+ for golangci-lint v2 — the v6
          # action targets v1 and, in goinstall mode, resolves the v1 module
          # path (…/golangci-lint/cmd/golangci-lint) which has no v2 tags
          # ("unknown revision cmd/golangci-lint/v2.12.2"). v8 is v2-aware and
          # uses the /v2/ module path.
          #
          # Pinned to a v2 release (Phase 14 / QUAL-01). ADR-0003 migrated
          # .golangci.yml to the v2 schema (version: "2") on 2026-07-04, so
          # the pin MUST be a v2 binary — the v2 parser cannot read a v1
          # config and vice versa. toyraft leads the trilogy to v2; siblings
          # (toymq + toykv) stay on v1 for now (deliberate, per 14-CONTEXT).
          # A pinned v2.x.y (not `latest`) keeps CI reproducible. Pinned to
          # the exact release the migrated config was verified clean against
          # (`golangci-lint run ./...` exit 0 locally on 2.12.2).
          version: v2.12.2
          # goinstall mode is REQUIRED for Go 1.26 source — the prebuilt
          # binary ships compiled with an older Go and cannot parse 1.26
          # packages (Pitfall 1, sibling-verbatim invariant).
          install-mode: goinstall

  test:
    name: test (${{ matrix.os }} / go ${{ matrix.go }} / ${{ matrix.race && 'race' || 'no-race' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.25.x', '1.26.x']
        # QUAL-03: cover {linux,macOS} x {race, no-race}. The race axis gates
        # the -race flag (see the RACE env below). no-race is faster and
        # exercises the un-instrumented build path; race is the correctness
        # gate. Both must stay green.
        race: [true, false]
    env:
      # Empty when matrix.race is false, "-race" when true. Each go-test step
      # below interpolates $RACE so a single matrix drives both build modes.
      RACE: ${{ matrix.race && '-race' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test ($RACE)
        # $RACE is "-race" on the race matrix leg and "" on the no-race leg
        # (QUAL-03: {linux,macOS} x {race,no-race}). Excludes ./test/chaos/...
        # AND ./test/linearizability/... — those trees are run by their
        # dedicated steps below so they aren't swept twice per matrix cell
        # (the process-kill harness boots 5 real daemons, slow on macOS
        # runners; the linearizability step is the single home for the
        # no-retry correctness comment). Making each dedicated step the
        # single source also gives clean failure attribution.
        run: go test $RACE -timeout 5m $(go list ./... | grep -Ev '/test/(chaos|linearizability)/')

      - name: Chaos suite (seeded inproc matrix + process-kill — CHAOS-07/SC5)
        # Phase 11 SC5: a chaos failure is TERMINAL and fails the build on
        # the first occurrence. This step is deliberately plain — no
        # conditional guard, no failure-tolerating modifier, no re-run loop:
        # masking a chaos flake would hide the very linearizability bug that
        # Phase 12 exists to catch. Runs on BOTH matrix OSes: the inproc
        # matrix is pure in-memory; the process-kill harness is
        # //go:build linux || darwin and both matrix OSes (ubuntu + macos)
        # are POSIX, so it runs on each. The step lives inside the existing
        # `test` job so no new required-status-check name is introduced
        # (ADR-0002 + branch protection unchanged).
        run: go test $RACE -timeout 10m ./test/chaos/...

      - name: Linearizability suite (Porcupine KV-register + Figure 7/8 — LIN-04/SC5)
        # Phase 12 SC5: a linearizability failure is TERMINAL and fails the
        # build on the first occurrence. Deliberately plain — no conditional
        # guard, no failure-tolerating modifier, no re-run loop: masking a
        # violation would defeat the correctness gate. Scripted concurrent
        # histories are byte-deterministic and fast, so this runs on both
        # matrix OSes with no flakiness budget. The step lives inside the
        # existing `test` job so no new required-status-check name is
        # introduced (ADR-0002 + branch protection unchanged).
        run: go test $RACE -timeout 5m ./test/linearizability/...

      - name: Test (raftdebug build tag — invariant negative tests)
        # Per ADR-0004 + .planning/phases/02-foundations/02-RESEARCH.md §6.3 /
        # Q4: SC4 (Phase 2) requires debug-build invariant assertions; this
        # step actually runs them so the scaffold is enforced by CI, not just
        # documented. NO `if:` modifier — SC4 is a correctness gate and must
        # run on BOTH push and pull_request events (contrast with the fuzz
        # step from plan 02-06 which IS gated to pull_request only).
        run: go test -tags raftdebug $RACE -timeout 5m ./pkg/raft

      - name: LLD drift check (SC6)
        # Per .planning/phases/02-foundations/02-RESEARCH.md §8 Option B and
        # plan 02-04: byte-for-byte diff of `go doc -all ./pkg/raft` against
        # docs/lld-go-doc-golden.txt. Any divergence fails the build; the
        # reviewer enforces that regenerated goldens land alongside the
        # docs/LLD.md change in the same PR. Step lives INSIDE the existing
        # `test` job so no new top-level required-status-check name is
        # introduced (branch-protection contexts remain unchanged).
        run: make lld-drift

      - name: Fuzz (Log surface, PR only — RFC-0002)
        # Per RFC-0002 + .planning/phases/02-foundations/02-06-PLAN.md: fuzz
        # the *Log surface (FOUND-02 methods only) on PRs. Push-to-main is
        # exempt to keep main CI fast; the gate already fired on the PR.
        # Step lives INSIDE the existing `test` job so no new top-level
        # required-status-check name is introduced (branch-protection
        # contexts set live via `gh api PUT` in Phase 1.1 remain unchanged).
        if: github.event_name == 'pull_request'
        # Go's -fuzz= flag must match exactly one fuzz function per
        # invocation; run each target in series. 30s per target is the
        # RFC-0002 PR budget.
        run: |
          go test -run=^$ -fuzz=^FuzzLogAppendTruncate$ -fuzztime=30s ./pkg/raft
          go test -run=^$ -fuzz=^FuzzLogMatch$ -fuzztime=30s ./pkg/raft

  commitlint:
    name: commitlint
    # PR-only: push to main is post-merge, the gate already fired.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # wagoid walks the PR commit range; full history required so
          # force-pushes + merge commits are handled correctly.
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6

  build:
    name: build (cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: cross-compile matrix
        # Single-runner env-var loop instead of strategy.matrix: cross-compile
        # is a compile-only check; spinning four runners just to invoke the
        # cross-compiler is wasteful. Justified in ADR-0002.
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  netns:
    name: netns
    # SC3 (CHAOS-04 / Phase 13): the iptables/netns partition chaos runs on a
    # DEDICATED linux-amd64 runner only — GitHub ubuntu runners are amd64 and
    # ship passwordless sudo + iproute2 + iptables. A DEDICATED job (not a
    # guarded step in `test`) is a deliberate reading of SC3's "linux-amd64
    # entry only": it runs on exactly one linux-amd64 runner and never touches
    # macOS. It adds exactly one new required-check name `netns` — recorded in
    # ADR-0002's amended required-check list + ADR-0020 and enforced via branch
    # protection (Task 3). Terminal-failure discipline (Phase 11): the run step
    # below carries no conditional guard, no failure-tolerating modifier, and no
    # re-run loop — a netns partition failure fails the build outright.
    # The netns package is tag-gated (//go:build linux && netns) so no existing
    # job compiles it: the `test` job's default race step excludes
    # /test/(chaos|linearizability)/ AND the tag keeps the tree out of the
    # ./test/chaos/... chaos step too, so the netns tree runs ONLY here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: netns capability probe (fail loudly on a runner gap)
        # RESEARCH Open-Q1: surface an iptables/netns capability gap HERE with a
        # clear message rather than mid-test. If the runner cannot create a
        # namespace, the whole job fails at this step, not deep in the harness.
        run: |
          set -euxo pipefail
          sudo iptables --version
          sudo ip netns add probe
          sudo ip netns del probe

      - name: netns partition chaos (CHAOS-04 / SC1)
        # sudo -E env "PATH=$PATH" preserves PATH + GOCACHE/HOME so `go` and the
        # built toyraftd resolve and the daemons spawned via `sudo ip netns exec`
        # land in their namespaces. The race detector is deliberately omitted:
        # the test orchestrates external daemons, so instrumenting the
        # (barely-concurrent) test process adds cost with no signal (RESEARCH
        # Open-Q3). The step is terminal — a plain run with no modifiers.
        run: sudo -E env "PATH=$PATH" go test -tags=netns -timeout 10m ./test/chaos/netns
